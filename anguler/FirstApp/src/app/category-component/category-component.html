<p>category-component works!</p>


<table class="table table-striped table-bordered">
	<thead>
		<tr>
            <th>Category ID</th>
			<th>Category Name</th>
            <th>Category Description</th>
		</tr>
	</thead>
	<tbody>
        <tr *ngFor="let category of categories">
            <td>{{ category.categoryId }}</td>
            <td>{{ category.name }}</td>
            <td>{{ category.description }}</td>
        </tr>
    </tbody>
</table>

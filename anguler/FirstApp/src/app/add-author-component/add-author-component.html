<h2>Add Author</h2>
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <form>
                <div class="form-group">
                    <label for="name">Author Name:</label>
                    <input type="text" class="form-control" id="name" [(ngModel)]="Author.name" name="name">
                </div>
                <div class="form-group">
                    <label for="country">Author Country:</label>
                    <input type="text" class="form-control" id="country" [(ngModel)]="Author.country" name="country">
                </div>
                <button type="button" class="btn btn-primary mt-2" (click)="addAuthor()">Add Author</button>
            </form>
    </div>
</div>
Author name : {{ Author.name }} <br>
Author country : {{ Author.country }} <br>
